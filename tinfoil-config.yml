cvm-version: 0.14.7
cpus: 2
memory: 8192

networks:
  relay:
    egress: allowlist
    allow:
      - tuft-rendezvous.fly.dev

containers:
  - name: app
    image: "ghcr.io/eiiot/appdrop-tinfoil-probe@sha256:0f2e84d429151e1a59efe844206ca940c793578a0406b7dc4c28239dfb4441f0"
    networks: [relay]

shim:
  upstream-port: 8080
  paths:
    - /health
    - /egress
    - /ws
