cvm-version: 0.14.7
cpus: 2
memory: 8192

networks:
  relay:
    egress: allowlist
    allow:
      - tuft-rendezvous.fly.dev

containers:
  - name: app
    image: "ghcr.io/eiiot/appdrop-tinfoil-probe@sha256:e508a180f2875e29698ec4a0a48178d6bbeebdfe5184f9be7a52937efef403fb" # v0.0.1
    networks: [relay]

shim:
  upstream-port: 8080
  paths:
    - /health
    - /egress
    - /ws
