cvm-version: 0.14.17
cpus: 2
memory: 8192

networks:
  public:
    egress: open

containers:
  - name: app
    image: "ghcr.io/eiiot/appdrop-tinfoil-probe@sha256:f3cc39aa3baa0a90fd03bf88b2c3c4cdd1f7590bfe3c5108f89290ddb2775791" # v0.3.0
    attestation: true
    env:
      - HOST_URL        # per-instance variable: where the operator's host is
      - OPERATOR_TOKEN  # per-instance variable: keeps strangers out of /rpc
    networks: [public]

shim:
  upstream-port: 8080
  paths:
    - /health
    - /probe
    - /rpc/*
