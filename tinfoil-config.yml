cvm-version: 0.14.17
cpus: 2
memory: 8192

networks:
  public:
    egress: open

containers:
  - name: app
    image: "ghcr.io/eiiot/appdrop-tinfoil-probe@sha256:a85fb8b51345d4e85f7967ce9bd961d32e0875655238770badaa41b6c1cda575" # v0.2.3
    attestation: true
    env:
      - HOST_URL        # per-instance variable: where the operator's host is
      - OPERATOR_TOKEN  # per-instance variable: keeps strangers out of /rpc
    networks: [public]

shim:
  upstream-port: 8080
  paths:
    - /health
    - /rpc/*
