cvm-version: 0.14.17
cpus: 2
memory: 8192

networks:
  public:
    egress: open

containers:
  - name: app
    image: "ghcr.io/eiiot/appdrop-tinfoil-probe@sha256:617e43520a9468e9b8c5f99faee24e6a2a22bd68258979411f9093c5ad017d40" # v0.2.2
    attestation: true
    env:
      - HOST_URL        # per-instance variable: where the operator's host is
      - OPERATOR_TOKEN  # per-instance variable: keeps strangers out of /rpc
    networks: [public]

shim:
  upstream-port: 8080
  paths:
    - /health
    - /rpc/*
