cvm-version: 0.14.7
cpus: 2
memory: 8192

networks:
  relay:
    egress: allowlist
    allow:
      - tuft-rendezvous.fly.dev

containers:
  - name: app
    image: ghcr.io/eiiot/appdrop-tinfoil-probe:placeholder
    networks: [relay]

shim:
  upstream-port: 8080
  paths:
    - /health
    - /egress
    - /ws
