cvm-version: 0.14.17
cpus: 2
memory: 8192

networks:
  relay:
    egress: allowlist
    allow:
      - tuft-rendezvous.fly.dev

containers:
  - name: app
    image: "ghcr.io/eiiot/appdrop-tinfoil-probe@sha256:9a62bf8379685f6a99cacf72b9a8aa87a0bdef2f907dff3d9c18a269b6778378" # v0.0.2
    networks: [relay]

shim:
  upstream-port: 8080
  paths:
    - /health
    - /egress
    - /ws
