cvm-version: 0.14.17
cpus: 2
memory: 8192

networks:
  public:
    egress: open

containers:
  - name: app
    image: "ghcr.io/eiiot/appdrop-tinfoil-probe@sha256:0f2e84d429151e1a59efe844206ca940c793578a0406b7dc4c28239dfb4441f0"
    attestation: true
    env:
      - HOST_URL        # per-instance variable: where the operator's host is
      - OPERATOR_TOKEN  # per-instance variable: keeps strangers out of /rpc
    networks: [public]

shim:
  upstream-port: 8080
  paths:
    - /health
    - /probe
    - /rpc/*
